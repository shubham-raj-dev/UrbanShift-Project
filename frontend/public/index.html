<!DOCTYPE html>

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/app-icon.png" />

          "logo": {
            "@type": "ImageObject",

          }

        {
          "@type": "Person",
          "@id": "https://urban-shift-project.vercel.app/#author",
